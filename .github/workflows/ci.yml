name: Awesome-OS Blender VS Code Extension CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Blender VS Code extension tests
        run: node --test test/blender-vscode.test.mts
